# Nirvana module registry — single source of truth for the 9-lane architecture.
# host: github = GitHub Actions (heavy, quota-free runners)
# host: oracle = Oracle VM (light listeners, cron/timer driven, quota-guarded)
nirvana:
  version: 1
  payment:
    amount: 2500
    currency: EUR
    link_env: PAYONEER_PAYMENT_URL
    link_placeholder: "[BURAYA_YENI_PAYONEER_LINKINI_EKLEYIN]"
  modules:
    discovery_agent:
      host: github
      letter: A
      schedule: "11 */6 * * *"
      entrypoint: "python -m nirvana.runner discovery_agent"
      description: "Find enterprise contractor/partner open-application targets; drop sales/support/newsletter pages."
      heavy: true
    enrichment_agent:
      host: github
      letter: B
      schedule: "23 */6 * * *"
      entrypoint: "python -m nirvana.runner enrichment_agent"
      description: "Free public technical recon (DNS, security.txt, tech-stack) + company-specific hook text."
      heavy: true
    audit_verifier_agent:
      host: github
      letter: C
      schedule: "41 */6 * * *"
      entrypoint: "python -m nirvana.runner audit_verifier_agent"
      description: "Fail-closed form ownership audit; unverified targets never reach the Oracle queue."
      heavy: true
    strategy_pivot_agent:
      host: github
      letter: D
      schedule: "17 3 * * *"
      entrypoint: "python -m nirvana.runner strategy_pivot_agent"
      description: "Autonomous A/B on hook text, free-pilot offer and timing from real outcomes."
      heavy: true
    objection_handler_agent:
      host: github
      letter: E
      schedule: "manual"
      entrypoint: "python -m nirvana.runner objection_handler_agent"
      description: "Price/security/time objections -> deterministic soft-landing pilot replies (Telegram + offline fallback)."
      heavy: false
    onboarding_agent:
      host: oracle
      letter: F
      schedule: "event"
      entrypoint: "python -m nirvana.runner onboarding_agent"
      description: "Payment-verified welcome protocol, terms and access guide."
      heavy: false
    delivery_runner:
      host: oracle
      letter: G
      schedule: "weekly"
      entrypoint: "python -m nirvana.runner delivery_runner"
      description: "Weekly client-infrastructure health sweeps + Telegram/email-channel reports."
      heavy: false
    retention_agent:
      host: github
      letter: H
      schedule: "17 9 1 * *"
      entrypoint: "python -m nirvana.runner retention_agent"
      description: "Monthly value report + 2.500 EUR renewal Payoneer link."
      heavy: false
    watchdog_quota_agent:
      host: oracle
      letter: I
      schedule: "*/5 * * * *"
      entrypoint: "python -m nirvana.runner watchdog_quota_agent"
      description: "Oracle CPU/RAM/HTTP-quota guard; autonomous cooling mode. Telegram'a bildirim ATMaz."
      heavy: false
    linkedin_router:
      host: oracle
      letter: J
      schedule: "0 8 * * *"
      entrypoint: "python -m nirvana.runner linkedin_router"
      description: "Captcha/no-form hedefleri -> LinkedIn inceleme karti + hazir outreach draft'i (kopyala/gonder). Otomasyon/scrape YOK; kanit raporsa mesaja eklenir."
      heavy: false
    meta_orchestrator:
      host: github
      letter: K
      schedule: "31 4 * * *"
      entrypoint: "python -m nirvana.runner meta_orchestrator"
      description: "Kendini gelistiren strateji: tum modul ciktilarini harmanlar, EMA serit agirliklari. Kotayi asla yukseltemez."
      heavy: false
    micro_audit_proof_agent:
      host: github
      letter: L
      schedule: "23 5 * * *"
      entrypoint: "python -m nirvana.runner micro_audit_proof_agent"
      description: "Playwright ile checkout/sepet darboğazi tespiti + isaretli Proof Card PNG + gozleme dayali dinamik kanca. Oracle'da Playwright HICBIR ZAMAN calismaz."
      heavy: true
    retainer_report_agent:
      host: github
      letter: M
      schedule: "47 5 * * *"
      entrypoint: "python -m nirvana.runner retainer_report_agent"
      description: "Value-in-advance: olculen bulgulardan kisisellestirilmis PDF denetim raporu (Pillow->PDF) + insan kimligi. Rapor linki form/telegram akisina gecer."
      heavy: true
    contract_pack:
      host: oracle
      letter: N
      schedule: "event"
      entrypoint: "python -m nirvana.runner contract_pack"
      description: "Dinamik SLA + NDA + fikri mülkiyet taslagi (sablon; hukuki danismanlik degil). Onboarding evresinde sunulur."
      heavy: false
    stealth_former:
      host: github
      letter: O
      schedule: "*/4 * * * *"
      entrypoint: "python -m nirvana.runner stealth_former"
      description: "Stealth form submitter: CAPTCHA yoksa gonderir, varsa linkedin_router'a rotalar (UCRETLI captcha cozulmez). Anti-detection + pacing."
      heavy: true
    message_optimizer:
      host: github
      letter: P
      schedule: "7 4 * * *"
      entrypoint: "python -m nirvana.runner message_optimizer"
      description: "PAS cercevesi + A/B test: mesaj varyasyonlarinin donusum skoru. En iyiyi otomatik secer."
      heavy: true
    github_orchestrator:
      host: oracle
      letter: Q
      schedule: "event"
      entrypoint: "python -m nirvana.runner github_orchestrator"
      description: "GitHub Actions REST API ile olay guendumlu serverless orkestrasyon. workflow_dispatch + repository_dispatch."
      heavy: false
    email_infra_audit:
      host: github
      letter: R
      schedule: "12 4 * * *"
      entrypoint: "python -m nirvana.runner email_infra_audit"
      description: "DNS/email altyapisi tespiti (SPF, DKIM, DMARC, MX). Form kanitina ek altyapi saglamligi kaniti."
      heavy: true
    tech_stack_detector:
      host: github
      letter: S
      schedule: "29 4 * * *"
      entrypoint: "python -m nirvana.runner tech_stack_detector"
      description: "Kullanilan teknolojileri tespit etmek (HTTP basliklari + HTML imzalari). Form kanitina ek teknik altyapi kaniti."
      heavy: true
    service_readiness:
      host: github
      letter: T
      schedule: "37 4 * * *"
      entrypoint: "python -m nirvana.runner service_readiness"
      description: "Hizmet altyapisi saglamligi: DNS/SSL/response/servis karisasi kontrolu. Hizmet verilmeden once hazirlik raporu."
      heavy: true
    multi_service_runner:
      host: oracle
      letter: U
      schedule: "event"
      entrypoint: "python -m nirvana.runner multi_service_runner"
      description: "Coklu hizmet yurutme: max 5 eszamanli musteri. Her biri izole, haftalik tur. Musteri memnun kalirsa tekrar gelir."
      heavy: false
    free_captcha_solver:
      host: github
      letter: V
      schedule: "*/4 * * * *"
      entrypoint: "python -m nirvana.runner free_captcha_solver"
      description: "Ucretsiz CAPTCHA cozucu: Tesseract OCR + Pillow. Basit metin CAPTCHA'larini cozer. Modern reCAPTCHA/Turnstile icin stealth + rotalama."
      heavy: true
    forget_guard:
      host: oracle
      letter: W
      schedule: "event"
      entrypoint: "python -m nirvana.runner forget_guard"
      description: "Anti-karisiklik bekcisi: token-bound sirket disinda link yok, domain-disi kanit yok. Sessiz guard, bildirim atmaz."
      heavy: false
    proof_card:
      host: oracle
      letter: X
      schedule: "event"
      entrypoint: "python -m nirvana.runner proof_card"
      description: "Gorsel kanıt kartı yonetimi: GitHub Actions micro_audit_proof_agent ürettiği PNG'yi state/proof_cards.json'dan okur, Telegram botu için URL sağlar."
      heavy: false
