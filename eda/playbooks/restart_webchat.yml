---
- name: Restart Webchat Server on Liveness Failure
  hosts: webchat_nodes
  tasks:
    - name: Restart webchat-server service
      ansible.builtin.systemd:
        name: webchat-server
        state: restarted
        daemon_reload: yes

    - name: Verify webchat health endpoint
      ansible.builtin.uri:
        url: "http://{{ inventory_hostname }}:8765/health"
        method: GET
        return_content: yes
        status_code: 200
      register: health_check
      until: health_check.status == 200
      retries: 5
      delay: 2
