[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nirvana"
version = "1.0.0"
description = "Tam otonom whitelabel ortaklık motoru — üretim ortamına hazır"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109,<1",
    "uvicorn[standard]>=0.29,<1",
    "edge-tts>=6.1.9,<7",
    "python-telegram-bot>=21.6,<22",
    "sdnotify>=0.3,<1",
    "playwright>=1.45.0,<2",
    "python-dotenv>=1.0.1,<2",
    "httpx>=0.27.0,<1",
    "curl_cffi>=0.6,<1",
    "pybreaker>=1.3,<2",
    "tenacity>=8.2,<9",
    "pillow>=10.0.0,<13",
    "PyYAML>=6.0,<7",
    "pact-python>=1.0,<2",
    "pytest>=7.0,<9",
    "pytest-asyncio>=0.23,<1",
    "opentelemetry-api>=1.24,<2",
    "opentelemetry-sdk>=1.24,<2",
    "opentelemetry-exporter-otlp>=1.24,<2",
    "opentelemetry-instrumentation-fastapi>=0.45b,<1",
    "opentelemetry-instrumentation-requests>=0.45b,<1",
    "celery>=5.3,<6",
    "asyncpg>=0.29,<1",
    "databases[postgresql]>=0.7,<1",
    "pydantic>=2.5,<3",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = ["-ra", "--strict-markers", "--import-mode=importlib"]
testpaths = ["tests"]
markers = [
    "contract: Consumer-Driven Contract Test (Pact)",
    "trace: Trace-Based Test (OpenTelemetry + Tracetest)",
    "vla: VLA AI model validation",
    "e2e: End-to-End integration test",
    "tenant: Multi-tenant veri izolasyon testi",
    "self-healing: Saniyelik kendi kendini onarma testi",
]
filterwarnings = [
    "error",
]
# CI'de skip/skipif/pytest.skip() tamamen yasak: bypass yok.

[tool.pytest.ini_options.python_functions]
# Parametrelendirilmiş teste boş veri kümesi gelirse atlama yok — hata fırlatılır.
empty_parameter_set_mark = "error"

[tool.setuptools]
packages = ["nirvana", "core", "services", "tools"]
# src dizin düzeni: paketler kök dizinde, import çakışması önlenir.
package-dir = {"" = "."}
