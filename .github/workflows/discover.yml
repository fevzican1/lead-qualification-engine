name: discover-cc-longtail

# GitHub-side harvest. Does not touch Oracle HTTP 22/hour.
# Fifty deterministic CDX shards rotate through new crawl slices every run.
on:
  schedule:
    # 8 saatte bir — benzersiz dakika: :43
    - cron: "43 1,9,17 * * *"
  workflow_dispatch:

# Ayni tetik ust uste bindiginde GitHub 1 running + 1 pending tutar;
# fazlasi dusurulur -> Pending/Queued kilitlenmesi olmaz, is tamamlanir.
concurrency:
  group: discover-cc-longtail
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  shard:
    uses: ./.github/workflows/harvest-shard.yml
    with:
      profile: longtail
      source: commoncrawl-longtail
      shard_count: 50
