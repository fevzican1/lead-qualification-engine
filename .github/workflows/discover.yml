name: discover-feed

# Manual run: Actions → discover-feed → Run workflow (branch: master)
# GitHub-side harvest. Does not touch Oracle HTTP 22/hour.
# Random CDX page sampling, so every run lands on a new slice of the crawl.
on:
  schedule:
    - cron: "20 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shard:
    uses: ./.github/workflows/harvest-shard.yml
    with:
      profile: all
      source: commoncrawl-cdx
      output: feeds/shards/commoncrawl-cdx.json
