name: harvest-shard

on:
  workflow_call:
    inputs:
      profile:
        required: true
        type: string
      source:
        required: true
        type: string
      output:
        required: false
        type: string
        default: ""
      shard_count:
        required: false
        type: number
        default: 50
      start_delay_seconds:
        required: false
        type: number
        default: 0

permissions:
  contents: write

concurrency:
  group: discovery-${{ inputs.source }}
  cancel-in-progress: false

jobs:
  gate:
    if: ${{ vars.ENABLE_LEGACY_SMB_WORKFLOWS == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Stagger fleet start
        env:
          DELAY_SECONDS: ${{ inputs.start_delay_seconds }}
        run: |
          if [ "$DELAY_SECONDS" -gt 0 ]; then sleep "$DELAY_SECONDS"; fi

  harvest:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -q httpx python-dotenv
      - name: Harvest 50 logical shards
        env:
          SHARD_COUNT: ${{ inputs.shard_count }}
        run: |
          python scripts/harvest_fleet.py \
            --profile "${{ inputs.profile }}" \
            --source "${{ inputs.source }}" \
            --out-dir feeds/shards \
            --shard-count "$SHARD_COUNT" \
            --per-page 1000 \
            --shard-deadline 120 \
            --fleet-deadline 1320 \
            --workers 1
      - name: Upload fleet shards
        uses: actions/upload-artifact@v4
        with:
          name: fleet-${{ inputs.source }}
          path: feeds/shards/${{ inputs.source }}-*.json
          if-no-files-found: error

  commit:
    needs: harvest
    runs-on: ubuntu-latest
    timeout-minutes: 8
    concurrency:
      group: discovery-shard-commit
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Download fleet shards
        uses: actions/download-artifact@v4
        with:
          name: fleet-${{ inputs.source }}
          path: feeds/shards
      - name: Commit fleet shards
        run: |
          set -euo pipefail
          git config user.name "devsolve-discover"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          SRC="${{ inputs.source }}"
          # Clean any conflict markers first (autostash conflicts bake them
          # into the JSON; merge_feed_shards then silently drops the shards).
          python scripts/clean_merge_markers.py feeds/shards/"${SRC}"-*.json
          for attempt in 1 2 3 4 5; do
            git add "feeds/shards/${SRC}-"*.json
            if ! python scripts/clean_merge_markers.py --check "feeds/shards/${SRC}-"*.json; then
              echo "Shards contain conflict markers/invalid JSON — refusing to commit"
              git reset -q 2>/dev/null || true
              git checkout -q -- "feeds/shards/${SRC}-"*.json 2>/dev/null || true
              sleep $((attempt * 5))
              continue
            fi
            if git diff --cached --quiet; then
              echo "No fleet shard changes"
              exit 0
            fi
            git commit -m "feed: update ${SRC} fleet shards"
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            # Never commit a half-written rebase. Drop any conflict state and
            # retry with a clean stage next pass.
            git rebase --abort 2>/dev/null || git merge --abort 2>/dev/null || true
            git reset --soft HEAD~1 2>/dev/null || true
            sleep $((attempt * 5))
          done
          echo "Fleet shard push failed after retries"
          exit 1
