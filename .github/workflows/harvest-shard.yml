name: harvest-shard

on:
  workflow_call:
    inputs:
      profile:
        required: true
        type: string
      source:
        required: true
        type: string
      output:
        required: false
        type: string
        default: ""
      shard_count:
        required: false
        type: number
        default: 50
      start_delay_seconds:
        required: false
        type: number
        default: 0

permissions:
  contents: write

concurrency:
  group: discovery-${{ inputs.source }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Stagger fleet start
        env:
          DELAY_SECONDS: ${{ inputs.start_delay_seconds }}
        run: |
          if [ "$DELAY_SECONDS" -gt 0 ]; then sleep "$DELAY_SECONDS"; fi

  harvest:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -q httpx python-dotenv
      - name: Harvest 50 logical shards
        env:
          SHARD_COUNT: ${{ inputs.shard_count }}
        run: |
          python scripts/harvest_fleet.py \
            --profile "${{ inputs.profile }}" \
            --source "${{ inputs.source }}" \
            --out-dir feeds/shards \
            --shard-count "$SHARD_COUNT" \
            --per-page 1000 \
            --shard-deadline 120 \
            --fleet-deadline 1320 \
            --workers 1
      - name: Upload fleet shards
        uses: actions/upload-artifact@v4
        with:
          name: fleet-${{ inputs.source }}
          path: feeds/shards/${{ inputs.source }}-*.json
          if-no-files-found: error

  commit:
    needs: harvest
    runs-on: ubuntu-latest
    timeout-minutes: 8
    concurrency:
      group: discovery-shard-commit
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Download fleet shards
        uses: actions/download-artifact@v4
        with:
          name: fleet-${{ inputs.source }}
          path: feeds/shards
      - name: Commit fleet shards
        run: |
          git config user.name "devsolve-discover"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || {
              git rebase --skip || git rebase --abort || true
            }
            git add "feeds/shards/${{ inputs.source }}-"*.json
            if git diff --cached --quiet; then
              echo "No fleet shard changes"
              exit 0
            fi
            git commit -m "feed: update ${{ inputs.source }} fleet shards"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "Fleet shard push failed after retries"
          exit 1
