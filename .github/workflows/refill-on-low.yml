name: refill-on-low

# Discovery runs on GitHub. This workflow reads Oracle queue + chromium fuel
# over SSH and starts staggered fleets when either metric is below watermark.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: refill-on-low
  cancel-in-progress: false

jobs:
  refill:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
      ORACLE_USER: ${{ secrets.ORACLE_USER }}
      ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Start fleets when Oracle fuel or queue is low
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ORACLE_HOST:-}" ] || [ -z "${ORACLE_SSH_KEY:-}" ]; then
            echo "Oracle secrets are not configured; watchdog handles stale fleets."
            exit 0
          fi
          ORACLE_USER="${ORACLE_USER:-ubuntu}"
          mkdir -p ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle.key
          chmod 600 ~/.ssh/oracle.key
          ssh-keyscan -T 8 -H "$ORACLE_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          metrics="$(
            ssh -i ~/.ssh/oracle.key \
              -o StrictHostKeyChecking=accept-new \
              -o IdentitiesOnly=yes \
              -o ConnectTimeout=8 \
              -o ConnectionAttempts=1 \
              -o BatchMode=yes \
              "${ORACLE_USER}@${ORACLE_HOST}" \
              "cd /opt/devsolve && .venv/bin/python -c 'import domain_store; print(f\"{domain_store.queue_depth()},{domain_store.chromium_fuel_count()},{domain_store.chromium_fuel_count(min_easy=80)},{domain_store.chromium_fuel_target()}\")'"
          )"
          IFS=',' read -r queue fuel fuel80 fuel_target <<< "$metrics"
          if ! [[ "$queue" =~ ^[0-9]+$ && "$fuel" =~ ^[0-9]+$ && "$fuel80" =~ ^[0-9]+$ && "$fuel_target" =~ ^[0-9]+$ ]]; then
            echo "Unable to read Oracle metrics: $metrics"
            exit 0
          fi
          echo "Oracle queue=$queue fuel=$fuel fuel80=$fuel80 target=$fuel_target"
          if [ "$queue" -ge 80 ] && [ "$fuel80" -ge "$fuel_target" ]; then
            echo "Queue and chromium fuel are healthy."
            exit 0
          fi

          slot=$(( ($(date -u +%M) / 6) % 5 ))
          families=(
            discover-cc-longtail
            discover-cc-tr
            discover-cc-global
            discover-cc-eu
            discover-cc-platform
          )
          workflow="${families[$slot]}"
          running="$(
            gh run list --workflow "$workflow" --json status \
              --jq '[.[] | select(.status == "in_progress" or .status == "queued")] | length'
          )"
          if [ "$running" -eq 0 ]; then
            echo "Dispatching $workflow for low Oracle fuel/queue."
            gh workflow run "$workflow" --ref "${GITHUB_REF_NAME}"
          else
            echo "$workflow is already running."
          fi
          publish_running="$(
            gh run list --workflow publish-feed --json status \
              --jq '[.[] | select(.status == "in_progress" or .status == "queued")] | length'
          )"
          if [ "$publish_running" -eq 0 ]; then
            echo "Dispatching publish-feed to sync Oracle."
            gh workflow run publish-feed --ref "${GITHUB_REF_NAME}"
          fi
