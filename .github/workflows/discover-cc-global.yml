name: discover-cc-global

on:
  schedule:
    # 4 saatte bir (1h offset) — benzersiz dakika: :23
    - cron: "23 1,5,9,13,17,21 * * *"
  workflow_dispatch:

# Ayni tetik ust uste bindiginde GitHub 1 running + 1 pending tutar;
# fazlasi dusurulur -> Pending/Queued kilitlenmesi olmaz, is tamamlanir.
concurrency:
  group: discover-cc-global
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  shard:
    uses: ./.github/workflows/harvest-shard.yml
    with:
      profile: global
      source: commoncrawl-global
      shard_count: 50
