name: discover-cc-global

on:
  schedule:
    - cron: "12,42 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shard:
    if: ${{ vars.ENABLE_LEGACY_SMB_WORKFLOWS == 'true' }}
    uses: ./.github/workflows/harvest-shard.yml
    with:
      profile: global
      source: commoncrawl-global
      shard_count: 50
