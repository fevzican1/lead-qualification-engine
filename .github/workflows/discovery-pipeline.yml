name: discovery-pipeline

# Unified queue/fuel pipeline (public repo — GitHub Actions minutes are free).
# Every 5 min: merge shards → publish feed → sync Oracle → dispatch harvest if low/stale.
# Replaces scheduled refill-on-low + discovery-watchdog + publish-feed cron.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  workflow_run:
    workflows:
      - publish-feed
    types:
      - completed

permissions:
  contents: write
  actions: write

concurrency:
  group: feed-publish
  cancel-in-progress: false

jobs:
  pipeline:
    if: ${{ vars.ENABLE_LEGACY_SMB_WORKFLOWS == 'true' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
      ORACLE_USER: ${{ secrets.ORACLE_USER }}
      ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -q httpx python-dotenv

      - name: Merge aggregate feed
        run: python scripts/merge_feed_shards.py --cap 60000

      - name: Commit aggregate feed when changed
        run: |
          git config user.name "devsolve-discover"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feeds/ready_queue.json
          if git diff --cached --quiet; then
            echo "No aggregate feed git changes"
            exit 0
          fi
          for attempt in 1 2 3 4 5; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || {
              git rebase --skip || git rebase --abort || true
            }
            git add feeds/ready_queue.json
            if git diff --cached --quiet; then
              echo "Feed already committed upstream"
              exit 0
            fi
            git commit -m "feed: discovery-pipeline publish"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1

      - name: Oracle metrics and harvest dispatch
        shell: bash
        run: |
          set -euo pipefail
          families=(
            discover-cc-longtail
            discover-cc-tr
            discover-cc-global
            discover-cc-eu
            discover-cc-platform
          )
          slot=$(( (10#$(date -u +%M) / 10) % ${#families[@]} ))
          primary="${families[$slot]}"
          need_harvest=0
          now_epoch=$(date -u +%s)
          feed_age_sec=999999
          if [ -f feeds/ready_queue.json ]; then
            feed_iso="$(python -c "import json; d=json.load(open('feeds/ready_queue.json')); print(str(d.get('updated_at') or '').replace('Z','+00:00'))")"
            if [ -n "$feed_iso" ]; then
              feed_epoch=$(date -u -d "$feed_iso" +%s 2>/dev/null || echo 0)
              if [ "$feed_epoch" -gt 0 ]; then
                feed_age_sec=$(( now_epoch - feed_epoch ))
              fi
            fi
          fi
          echo "Feed age ${feed_age_sec}s (primary fleet=$primary)"
          if [ "$feed_age_sec" -gt 600 ]; then
            echo "Feed stale >10m — force harvest"
            need_harvest=1
          fi
          if [ -z "${ORACLE_HOST:-}" ] || [ -z "${ORACLE_SSH_KEY:-}" ]; then
            echo "Oracle SSH not configured — harvest dispatch on stale check only"
            need_harvest=1
          else
            ORACLE_USER="${ORACLE_USER:-ubuntu}"
            mkdir -p ~/.ssh
            printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle.key
            chmod 600 ~/.ssh/oracle.key
            ssh-keyscan -T 8 -H "$ORACLE_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
            metrics="$(
              ssh -i ~/.ssh/oracle.key \
                -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes \
                -o ConnectTimeout=8 -o ConnectionAttempts=1 -o BatchMode=yes \
                "${ORACLE_USER}@${ORACLE_HOST}" \
                "cd /opt/devsolve && .venv/bin/python -c 'import domain_store; print(f\"{domain_store.queue_depth()},{domain_store.chromium_fuel_count()},{domain_store.chromium_fuel_count(min_easy=80)},{domain_store.chromium_fuel_target()}\")'"
            )" || metrics=""
            if [[ "$metrics" =~ ^[0-9]+,[0-9]+,[0-9]+,[0-9]+$ ]]; then
              IFS=',' read -r queue fuel fuel80 fuel_target <<< "$metrics"
              echo "Oracle queue=$queue fuel=$fuel fuel80=$fuel80 target=$fuel_target"
              if [ "$queue" -lt 80 ] || [ "$fuel80" -lt "$fuel_target" ]; then
                need_harvest=1
              fi
            else
              echo "Oracle metrics unavailable — dispatch harvest"
              need_harvest=1
            fi
          fi
          last_iso="$(gh run list --workflow "$primary" --limit 1 --json createdAt --jq '.[0].createdAt // empty')"
          if [ -n "$last_iso" ]; then
            last_epoch=$(date -u -d "$last_iso" +%s)
            age=$(( now_epoch - last_epoch ))
            echo "$primary last run ${age}s ago"
            if [ "$age" -gt 1500 ]; then
              need_harvest=1
            fi
          else
            need_harvest=1
          fi
          if [ "$need_harvest" -eq 1 ]; then
            dispatch_list=("$primary")
            if [ "$feed_age_sec" -gt 600 ]; then
              dispatch_list=("${families[@]}")
            elif [[ "$metrics" =~ ^[0-9]+,[0-9]+,[0-9]+,[0-9]+$ ]] && [ "$fuel80" -lt "$fuel_target" ]; then
              # Fuel thin: dispatch the primary AND the next family so the tank
              # refills within one 5-minute cycle instead of one family per slot.
              dispatch_list+=("${families[$(( (slot + 1) % ${#families[@]} ))]}")
            fi
            for workflow in "${dispatch_list[@]}"; do
              running="$(gh run list --workflow "$workflow" --json status --jq '[.[] | select(.status == "in_progress" or .status == "queued")] | length')"
              if [ "$running" -gt 0 ]; then
                echo "$workflow already running — skip"
                continue
              fi
              echo "Dispatching $workflow"
              gh workflow run "$workflow" --ref "${GITHUB_REF_NAME}"
            done
          fi

      - name: Sync aggregate feed to Oracle
        env:
          HOST: ${{ secrets.ORACLE_HOST }}
          USER: ${{ secrets.ORACLE_USER }}
          SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${HOST:-}" ] || [ -z "${SSH_KEY:-}" ]; then
            echo "ORACLE_HOST / ORACLE_SSH_KEY not set — feed on GitHub raw URL only"
            exit 0
          fi
          USER="${USER:-ubuntu}"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/oracle.key
          chmod 600 ~/.ssh/oracle.key
          ssh-keyscan -T 8 -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh -i ~/.ssh/oracle.key -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes \
            -o ConnectTimeout=8 -o ConnectionAttempts=1 -o BatchMode=yes \
            "${USER}@${HOST}" "mkdir -p /opt/devsolve/feeds /opt/devsolve/scripts"
          scp -i ~/.ssh/oracle.key -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes \
            -o ConnectTimeout=8 -o ConnectionAttempts=1 -o BatchMode=yes \
            feeds/ready_queue.json "${USER}@${HOST}:/opt/devsolve/feeds/ready_queue.json.pipeline.tmp"
          scp -i ~/.ssh/oracle.key -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes \
            -o ConnectTimeout=8 -o ConnectionAttempts=1 -o BatchMode=yes \
            scripts/oracle-feed-sync.sh "${USER}@${HOST}:/opt/devsolve/scripts/oracle-feed-sync.sh"
          ssh -i ~/.ssh/oracle.key -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes \
            -o ConnectTimeout=8 -o ConnectionAttempts=1 -o BatchMode=yes \
            "${USER}@${HOST}" "chmod +x /opt/devsolve/scripts/oracle-feed-sync.sh && mv -f /opt/devsolve/feeds/ready_queue.json.pipeline.tmp /opt/devsolve/feeds/ready_queue.json"
