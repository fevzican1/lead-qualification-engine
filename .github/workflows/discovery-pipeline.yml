name: discovery-pipeline

# Unified queue/fuel pipeline (public repo — GitHub Actions minutes are free).
# Her 30 dk: merge shards → publish feed → sync Oracle → yalnizca gerçekten
# bayatlamis (90+ dk) TEK bir fleet'i dispatch eder.
# CASCADE YOK: workflow_run tetikleyicisi bilerek kaldirildi — publish-feed
# bitisi pipeline'i, fleet bitisleri publish-feed'i ASLA tetiklemez. Her
# workflow yalniz kendi cron'unda calisir (15/20/25/10/5 fleet dakikalari).
on:
  schedule:
    - cron: "2,32 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: feed-publish
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
      ORACLE_USER: ${{ secrets.ORACLE_USER }}
      ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -q httpx python-dotenv

      - name: Merge aggregate feed
        run: python scripts/merge_feed_shards.py --cap 60000

      - name: Commit aggregate feed when changed
        run: |
          git config user.name "devsolve-discover"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feeds/ready_queue.json
          if git diff --cached --quiet; then
            echo "No aggregate feed git changes"
            exit 0
          fi
          for attempt in 1 2 3 4 5; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || {
              git rebase --skip || git rebase --abort || true
            }
            git add feeds/ready_queue.json
            if git diff --cached --quiet; then
              echo "Feed already committed upstream"
              exit 0
            fi
            git commit -m "feed: discovery-pipeline publish"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1

      - name: Oracle metrics and harvest dispatch (pacing-safe)
        shell: bash
        run: |
          set -euo pipefail
          families=(
            discover-cc-longtail
            discover-cc-tr
            discover-cc-global
            discover-cc-eu
            discover-cc-platform
          )
          slot=$(( (10#$(date -u +%M) / 10) % ${#families[@]} ))
          primary="${families[$slot]}"
          # PACING GUARANTEE: dispatch YALNIZCA primary fleet 90+ dk'dir hic
          # calismadiysa ve su an calismiyorsa, TEK fleet ile yapilir.
          # Feed stali/kuyruk dusekligi burada dispatch tetiklemez: fleet'lerin
          # kendi cron'lari (10-40 dk farkli dakikalar) ve refill-on-low
          # (saatte 1, kuyruk<80 acil) yakit hattini zaten besler. Bu sekilde
          # her 30 dk'lik pipeline turu en fazla 1 fleet dispatch edebilir,
          # cascade ve runner yiginini engeller.
          now_epoch=$(date -u +%s)
          need_harvest=0
          last_iso="$(gh run list --workflow "$primary" --limit 1 --json createdAt --jq '.[0].createdAt // empty')"
          if [ -z "$last_iso" ]; then
            echo "$primary has no runs yet - dispatch once"
            need_harvest=1
          else
            last_epoch=$(date -u -d "$last_iso" +%s)
            age=$(( now_epoch - last_epoch ))
            echo "$primary last run ${age}s ago"
            if [ "$age" -gt 3600 ]; then
              echo "Stale >90m - dispatch single fleet"
              need_harvest=1
            fi
          fi
          if [ "$need_harvest" -eq 1 ]; then
            running="$(gh run list --workflow "$primary" --json status --jq '[.[] | select(.status == "in_progress" or .status == "queued")] | length' || echo 1)"
            if [ "$running" -eq 0 ]; then
              echo "Dispatching $primary"
              gh workflow run "$primary" --ref "${GITHUB_REF_NAME}" || \
                echo "WARN: dispatch failed for $primary (disabled or missing) - continuing"
            else
              echo "$primary already running - skip"
            fi
          fi

      - name: Sync aggregate feed to Oracle
        env:
          HOST: ${{ secrets.ORACLE_HOST }}
          USER: ${{ secrets.ORACLE_USER }}
          SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${HOST:-}" ] || [ -z "${SSH_KEY:-}" ]; then
            echo "ORACLE_HOST / ORACLE_SSH_KEY not set — feed on GitHub raw URL only"
            exit 0
          fi
          USER="${USER:-ubuntu}"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/oracle.key
          chmod 600 ~/.ssh/oracle.key
          ssh-keyscan -T 8 -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh -i ~/.ssh/oracle.key -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes \
            -o ConnectTimeout=8 -o ConnectionAttempts=1 -o BatchMode=yes \
            "${USER}@${HOST}" "mkdir -p /opt/devsolve/feeds /opt/devsolve/scripts"
          scp -i ~/.ssh/oracle.key -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes \
            -o ConnectTimeout=8 -o ConnectionAttempts=1 -o BatchMode=yes \
            feeds/ready_queue.json "${USER}@${HOST}:/opt/devsolve/feeds/ready_queue.json.pipeline.tmp"
          scp -i ~/.ssh/oracle.key -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes \
            -o ConnectTimeout=8 -o ConnectionAttempts=1 -o BatchMode=yes \
            scripts/oracle-feed-sync.sh "${USER}@${HOST}:/opt/devsolve/scripts/oracle-feed-sync.sh"
          ssh -i ~/.ssh/oracle.key -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes \
            -o ConnectTimeout=8 -o ConnectionAttempts=1 -o BatchMode=yes \
            "${USER}@${HOST}" "chmod +x /opt/devsolve/scripts/oracle-feed-sync.sh && mv -f /opt/devsolve/feeds/ready_queue.json.pipeline.tmp /opt/devsolve/feeds/ready_queue.json"
