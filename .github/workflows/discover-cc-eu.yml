name: discover-cc-eu

on:
    # On-demand fleet: discovery-pipeline düşük yakıt tespitinde dispatch eder;
    # sabit schedule kaldırıldı — gereksiz sürekli yük yok, gerektiğinde çalışır.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shard:
    if: ${{ vars.ENABLE_LEGACY_SMB_WORKFLOWS == 'true' }}
    uses: ./.github/workflows/harvest-shard.yml
    with:
      profile: eu
      source: commoncrawl-eu
      shard_count: 50
