name: discover-cc-eu

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shard:
    if: ${{ vars.ENABLE_LEGACY_SMB_WORKFLOWS == 'true' }}
    uses: ./.github/workflows/harvest-shard.yml
    with:
      profile: eu
      source: commoncrawl-eu
      shard_count: 50
