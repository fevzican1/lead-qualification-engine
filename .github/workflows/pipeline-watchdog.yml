name: pipeline-watchdog

# GitHub scheduled workflows can stall for 1–2h on public repos. Every 5 min:
# if discovery-pipeline has not run in 11+ minutes, dispatch it.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: pipeline-watchdog
  cancel-in-progress: false

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Dispatch discovery-pipeline when stale
        shell: bash
        run: |
          set -euo pipefail
          running="$(
            gh run list --workflow discovery-pipeline.yml --json status \
              --jq '[.[] | select(.status == "in_progress" or .status == "queued")] | length'
          )"
          if [ "$running" -gt 0 ]; then
            echo "discovery-pipeline already active — skip"
            exit 0
          fi
          last_iso="$(
            gh run list --workflow discovery-pipeline.yml --limit 1 --json createdAt \
              --jq '.[0].createdAt // empty'
          )"
          if [ -z "$last_iso" ]; then
            echo "No prior discovery-pipeline run — dispatching"
            gh workflow run discovery-pipeline.yml --ref "${GITHUB_REF_NAME}"
            exit 0
          fi
          now_epoch=$(date -u +%s)
          last_epoch=$(date -u -d "$last_iso" +%s)
          age=$(( now_epoch - last_epoch ))
          echo "discovery-pipeline last run ${age}s ago ($last_iso)"
          if [ "$age" -gt 660 ]; then
            echo "Stale (>11 min) — dispatching discovery-pipeline"
            gh workflow run discovery-pipeline.yml --ref "${GITHUB_REF_NAME}"
          else
            echo "Fresh enough — no dispatch"
          fi
