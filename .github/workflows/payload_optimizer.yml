name: payload-optimizer

# Hourly GitHub-side optimizer: fetch HTML, personalize hooks, push to Oracle ingest.
# Oracle HTTP probe budget is untouched — all fetches run on GitHub runners.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: payload-optimizer
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
      ORACLE_USER: ${{ secrets.ORACLE_USER }}
      ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
      INGEST_API_TOKEN: ${{ secrets.INGEST_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -q httpx python-dotenv
      - name: Build optimized payloads on GitHub runner
        run: |
          python scripts/payload_optimizer.py \
            --min-score 85 \
            --limit 96 \
            --workers 8 \
            --timeout 12 \
            --out optimized_batch.json
      - name: Push batch to Oracle ingest API (SSH localhost)
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s optimized_batch.json ]; then
            echo "No optimized targets this hour"
            exit 0
          fi
          if [ -z "${ORACLE_HOST:-}" ] || [ -z "${ORACLE_SSH_KEY:-}" ]; then
            echo "Oracle secrets missing — batch stays in workflow artifact only"
            exit 0
          fi
          USER="${ORACLE_USER:-ubuntu}"
          mkdir -p ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle.key
          chmod 600 ~/.ssh/oracle.key
          ssh-keyscan -T 8 -H "$ORACLE_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          scp -i ~/.ssh/oracle.key -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes \
            -o ConnectTimeout=12 -o BatchMode=yes \
            optimized_batch.json "${USER}@${ORACLE_HOST}:/tmp/optimized_batch.json"

          read_oracle_token() {
            ssh -i ~/.ssh/oracle.key -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes \
              -o ConnectTimeout=12 -o BatchMode=yes \
              "${USER}@${ORACLE_HOST}" \
              "grep '^INGEST_API_TOKEN=' /opt/devsolve/.env 2>/dev/null | head -1 | cut -d= -f2- | tr -d '\r' | tr -d '\"' | tr -d \"'\""
          }

          push_ingest() {
            local token="$1"
            ssh -i ~/.ssh/oracle.key -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes \
              -o ConnectTimeout=12 -o BatchMode=yes \
              "${USER}@${ORACLE_HOST}" \
              "curl -fsS -X POST http://127.0.0.1:8787/api/v1/ingest \
                -H 'Authorization: Bearer ${token}' \
                -H 'Content-Type: application/json' \
                --data-binary @/tmp/optimized_batch.json"
          }

          ORACLE_TOKEN="$(read_oracle_token || true)"
          if [ -n "${ORACLE_TOKEN:-}" ] && [ "${ORACLE_TOKEN}" != "change-me" ]; then
            if push_ingest "${ORACLE_TOKEN}"; then
              echo "Ingest OK with Oracle .env token"
              exit 0
            fi
            echo "Oracle token rejected — trying GitHub secret sync"
          fi

          if [ -z "${INGEST_API_TOKEN:-}" ]; then
            echo "INGEST_API_TOKEN secret missing and Oracle token invalid"
            exit 1
          fi

          ssh -i ~/.ssh/oracle.key -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes \
            -o ConnectTimeout=12 -o BatchMode=yes \
            "${USER}@${ORACLE_HOST}" \
            "grep -q '^INGEST_API_TOKEN=' /opt/devsolve/.env && \
              sed -i 's|^INGEST_API_TOKEN=.*|INGEST_API_TOKEN=${INGEST_API_TOKEN}|' /opt/devsolve/.env || \
              printf '\nINGEST_API_TOKEN=${INGEST_API_TOKEN}\n' >> /opt/devsolve/.env; \
             sudo systemctl restart devsolve-ingest.service"

          push_ingest "${INGEST_API_TOKEN}"
          echo "Ingest OK after syncing GitHub secret to Oracle"
      - name: Upload optimizer artifact
        uses: actions/upload-artifact@v4
        with:
          name: optimized-batch
          path: optimized_batch.json
          if-no-files-found: warn
      - name: Wake discovery-pipeline if stale
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          running="$(
            gh run list --workflow discovery-pipeline.yml --json status \
              --jq '[.[] | select(.status == "in_progress" or .status == "queued")] | length'
          )"
          if [ "$running" -gt 0 ]; then
            echo "discovery-pipeline already active"
            exit 0
          fi
          last_iso="$(
            gh run list --workflow discovery-pipeline.yml --limit 1 --json createdAt \
              --jq '.[0].createdAt // empty'
          )"
          if [ -z "$last_iso" ]; then
            gh workflow run discovery-pipeline.yml --ref "${GITHUB_REF_NAME}"
            exit 0
          fi
          age=$(( $(date -u +%s) - $(date -u -d "$last_iso" +%s) ))
          echo "discovery-pipeline last run ${age}s ago"
          if [ "$age" -gt 660 ]; then
            gh workflow run discovery-pipeline.yml --ref "${GITHUB_REF_NAME}"
          fi
