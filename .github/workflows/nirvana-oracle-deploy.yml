name: nirvana-oracle-deploy

# Oracle VM canlıya alma: SSH üzerinden git pull + Payoneer linki (.env) +
# nirvana_oracle_install.sh (watchdog/delivery systemd timer'ları).
# Link asla repoya yazılmaz; PAYONEER_LINK repo secret'ından gelir.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nirvana-oracle-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HOST: ${{ secrets.ORACLE_HOST }}
      USER: ${{ secrets.ORACLE_USER }}
      SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
      PAYONEER_LINK: ${{ secrets.PAYONEER_LINK }}
      # Oracle'dan tam 15dk'da bir workflow tetiklemek için Actions:write PAT
      # (secret yoksa boş geçilir — Oracle timer'ı Telegram uyarı modunda bekler).
      GH_DISPATCH_TOKEN: ${{ secrets.GH_PAT_TOKEN }}
      TG_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TG_BOT_USERNAME: ${{ secrets.TELEGRAM_BOT_USERNAME }}
      TG_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
      TG_NOTIFY_BOT_TOKEN: ${{ secrets.TELEGRAM_NOTIFY_BOT_TOKEN }}
      TG_NOTIFY_CHAT_ID: ${{ secrets.TELEGRAM_NOTIFY_CHAT_ID }}
      ADMIN_CODE: ${{ secrets.ADMIN_CODE }}
    steps:
      - uses: actions/checkout@v4
      - name: SSH anahtarı hazırla
        run: |
          set -euo pipefail
          if [ -z "${HOST:-}" ] || [ -z "${USER:-}" ] || [ -z "${SSH_KEY:-}" ]; then
            echo "::error::ORACLE_HOST / ORACLE_USER / ORACLE_SSH_KEY secret'ları tanımlı değil."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/oracle.key
          chmod 600 ~/.ssh/oracle.key
          ssh-keyscan -T 8 -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
      - name: Paketle (commit'lenmiş kod only — git archive)
        run: |
          set -euo pipefail
          # TÜM üst-düzey .py modülleri paketlenir. Elle dosya saymak kırılgan:
          # yeni bir import (heartbeat.py, task_queue.py, circuit_breaker.py)
          # eklenince Oracle'da ModuleNotFoundError ile satış botu çöküyordu ve
          # deploy yine "success" görünüyordu (sessiz ölüm). Modül kümesi artık
          # depodan dinamik türetilir.
          TOP_PY="$(git ls-tree -r --name-only HEAD | grep -E '^[^/]+\.py$' | tr '\n' ' ')"
          git archive -o /tmp/nirvana-deploy.tgz HEAD $TOP_PY nirvana oracle knowledge requirements.txt .env.example
          test -s /tmp/nirvana-deploy.tgz
          echo "paket: $(tar -tzf /tmp/nirvana-deploy.tgz | wc -l) dosya"
          # Regresyon kapısı: botun/runner'ın import zinciri pakette olmalı.
          for need in heartbeat.py task_queue.py circuit_breaker.py config.py knowledge.py \
                      telegram_sales_bot.py auto_runner.py owner_notify.py payment_safety.py; do
            tar -tzf /tmp/nirvana-deploy.tgz | grep -qE "(^|/)${need}$" \
              || { echo "::error::${need} pakette yok — deploy iptal (ModuleNotFoundError riski)"; exit 1; }
          done
          echo "import zinciri pakette: OK"
      - name: Oracle'a yükle (scp)
        run: |
          set -euo pipefail
          scp -i ~/.ssh/oracle.key -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes \
              -o ConnectTimeout=10 -o BatchMode=yes \
              /tmp/nirvana-deploy.tgz "${USER}@${HOST}:/tmp/nirvana-deploy.tgz"
      - name: Deploy + canlı doğrulama
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/oracle.key \
              -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes \
              -o ConnectTimeout=10 -o ConnectionAttempts=1 -o BatchMode=yes \
              "${USER}@${HOST}" "PAYONEER_LINK='${PAYONEER_LINK}' TG_BOT_TOKEN='${TG_BOT_TOKEN:-}' TG_BOT_USERNAME='${TG_BOT_USERNAME:-}' TG_OWNER_CHAT_ID='${TG_OWNER_CHAT_ID:-}' TG_NOTIFY_BOT_TOKEN='${TG_NOTIFY_BOT_TOKEN:-}' TG_NOTIFY_CHAT_ID='${TG_NOTIFY_CHAT_ID:-}' ADMIN_CODE='${ADMIN_CODE:-}' GH_DISPATCH_TOKEN='${GH_DISPATCH_TOKEN}' bash -s" <<'REMOTE'
          set -euo pipefail
          echo "=== [0] Telegram/ops config → /opt/devsolve/.env (only when secret set) ==="
          for kv in \
            "TELEGRAM_BOT_TOKEN|${TG_BOT_TOKEN}" \
            "TELEGRAM_BOT_USERNAME|${TG_BOT_USERNAME}" \
            "TELEGRAM_OWNER_CHAT_ID|${TG_OWNER_CHAT_ID}" \
            "TELEGRAM_NOTIFY_BOT_TOKEN|${TG_NOTIFY_BOT_TOKEN}" \
            "TELEGRAM_NOTIFY_CHAT_ID|${TG_NOTIFY_CHAT_ID}" \
            "ADMIN_CODE|${ADMIN_CODE}" \
            "GITHUB_DISPATCH_TOKEN|${GH_DISPATCH_TOKEN}"; do
            key="${kv%%|*}"; val="${kv#*|}"
            if [ -n "$val" ] && [ "$val" != "null" ]; then
              touch /opt/devsolve/.env
              if grep -q "^${key}=" /opt/devsolve/.env; then
                sed -i "s|^${key}=.*|${key}=${val}|" /opt/devsolve/.env
              else
                printf '%s=%s\n' "${key}" "${val}" >> /opt/devsolve/.env
              fi
              echo "wrote ${key}"
            fi
          done
          # Bot kimligi: musterinin sohbette gordugu gorunen ad + profil
          # aciklamasi 'bot'/'yapay zeka' icermez. Degerler heredoc icinde
          # literal yazilir (komut satiri kodlamasina takilmaz); boylece
          # BotFather'daki eski isim ("MyCompany_sale_bot") ezilir.
          for kv in \
            "BOT_DISPLAY_NAME|DevSolve Teknik Ekip" \
            "BOT_PUBLIC_DESCRIPTION|DevSolve — teknik satış ve operasyon ekibi. Entegrasyon ve otomasyon kapsamı için yazın."; do
            key="${kv%%|*}"; val="${kv#*|}"
            if grep -q "^${key}=" /opt/devsolve/.env; then
              sed -i "s|^${key}=.*|${key}=${val}|" /opt/devsolve/.env
            else
              printf '%s=%s\n' "${key}" "${val}" >> /opt/devsolve/.env
            fi
            echo "wrote ${key}"
          done
          echo "=== [1] Paket açma (reviewed committed code, /opt/devsolve) ==="
          cd /opt/devsolve
          tar -xzf /tmp/nirvana-deploy.tgz -C /opt/devsolve
          find nirvana -name '*.sh' -exec sed -i 's/\r$//' {} + 2>/dev/null || true
          find oracle -type f -exec sed -i 's/\r$//' {} + 2>/dev/null || true
          sed -i 's/\r$//' oracle/nirvana_oracle_install.sh
          chmod +x oracle/nirvana_oracle_install.sh
          echo "=== [2] Nirvana kurulum (link + systemd timer'lar) ==="
          # Form akisi garanti: SMB seridi acik + enterprise cap ayarli. 2026-09
          # retainer hedefleri Oracle .env'ine yazilir (eski 32/300/16 degerleri
          # override edilir): 400/gun, 48/saat, yakıt 500.
          for kv in \
            "SMB_LANE_ENABLED|1" \
            "ENTERPRISE_DAILY_CAP|40" \
            "ENTERPRISE_HOURLY_CAP|4" \
            "DAILY_SUBMIT_LIMIT|400" \
            "HOURLY_SUBMIT_LIMIT|48" \
            "HOURLY_SUBMIT_FLOOR|40" \
            "DAILY_HTTP_PROBE_LIMIT|800" \
            "HOURLY_HTTP_PROBE_LIMIT|40" \
            "CHROMIUM_BATCH|40" \
            "PIPELINE_SUBMIT_SLICE|24" \
            "QUEUE_TARGET|500" \
            "QUEUE_REFILL_BELOW|150" \
            "QUEUE_MAX|2500" \
            "FUEL_TARGET|500" \
            "PIPELINE_TIMEOUT_SECONDS|180"; do
            key="${kv%%|*}"; val="${kv#*|}"
            if grep -q "^${key}=" .env; then
              sed -i "s|^${key}=.*|${key}=${val}|" .env
            else
              printf '%s=%s\n' "${key}" "${val}" >> .env
            fi
          done
          sudo -n PAYONEER_LINK="${PAYONEER_LINK:-}" bash oracle/nirvana_oracle_install.sh
          echo "=== [2b] Kurulum sonrasi retainer kotasi garantiye aliniyor (idempotent re-assert) ==="
          # Install script eski .env degerlerini geri yazabilirsa diye 400/48/500
          # hedefleri kurulumdan SONRA tekrar uygulanir — son durum her zaman yeni retainer.
          for kv in \
            "SMB_LANE_ENABLED|1" \
            "ENTERPRISE_DAILY_CAP|40" \
            "ENTERPRISE_HOURLY_CAP|4" \
            "DAILY_SUBMIT_LIMIT|400" \
            "HOURLY_SUBMIT_LIMIT|48" \
            "HOURLY_SUBMIT_FLOOR|40" \
            "DAILY_HTTP_PROBE_LIMIT|800" \
            "HOURLY_HTTP_PROBE_LIMIT|40" \
            "CHROMIUM_BATCH|40" \
            "PIPELINE_SUBMIT_SLICE|24" \
            "QUEUE_TARGET|500" \
            "QUEUE_REFILL_BELOW|150" \
            "QUEUE_MAX|2500" \
            "FUEL_TARGET|500" \
            "PIPELINE_TIMEOUT_SECONDS|180"; do
            key="${kv%%|*}"; val="${kv#*|}"
            if grep -q "^${key}=" .env; then
              sed -i "s|^${key}=.*|${key}=${val}|" .env
            else
              printf '%s=%s\n' "${key}" "${val}" >> .env
            fi
          done
          echo "kota teyidi: $(grep -E '^(DAILY_SUBMIT_LIMIT|HOURLY_SUBMIT_LIMIT|FUEL_TARGET|QUEUE_TARGET)=' .env | tr '\n' ' ')"
          echo "=== [3] Canlı doğrulama ==="
          .venv/bin/python - <<'PY'
          import config
          import nirvana.payment as p
          print("retainer:", p.retainer_label())
          print("link aktif:", p.payment_link()[:52] + "...")
          print("telegram bildirim kanali:", bool(config.TELEGRAM_NOTIFY_BOT_TOKEN or config.TELEGRAM_BOT_TOKEN))
          print("telegram bildirim hedefi:", bool(config.TELEGRAM_NOTIFY_CHAT_ID or config.TELEGRAM_OWNER_CHAT_ID))
          print("satis botu tokeni:", bool(config.TELEGRAM_BOT_TOKEN), "| owner chat:", bool(config.TELEGRAM_OWNER_CHAT_ID))
          print("form seritleri: SMB=", config.SMB_LANE_ENABLED, " ENTERPRISE=", config.ENTERPRISE_MODE,
                " caps=", config.ENTERPRISE_DAILY_CAP, "/", config.ENTERPRISE_HOURLY_CAP)
          from nirvana import watchdog_quota_agent as w
          print("watchdog kota:", w.quota_snapshot())
          print("cooldown:", w.in_cooldown())
          PY
          systemctl list-timers 'nirvana-*' --no-pager || sudo -n systemctl list-timers 'nirvana-*' --no-pager
          echo "dispatch timer durumu: $(systemctl is-enabled nirvana-dispatch.timer 2>/dev/null || sudo -n systemctl is-enabled nirvana-dispatch.timer 2>/dev/null || echo 'kurulamadı')"
          echo "=== [4] Satış botu + runner (self-healing) canlıya alma ==="
          # devsolve-bot.service eski kopyadır ve AYNI telegram_sales_bot.py'yi
          # çalıştırır; ikisi aynı anda açılırsa Telegram getUpdates çakışır
          # (Conflict: terminated by other getUpdates). Eski unit kapatılır;
          # tek yetkili unit nirvana-salesbot.service (Type=notify + watchdog).
          if systemctl list-unit-files devsolve-bot.service >/dev/null 2>&1; then
            sudo -n systemctl stop devsolve-bot.service 2>/dev/null || true
            sudo -n systemctl disable devsolve-bot.service 2>/dev/null || true
            echo "devsolve-bot.service devre dışı — çift polling engellendi"
          fi
          # Import kapısı: paket eksikse (ModuleNotFoundError) burada açıkça patlar.
          .venv/bin/python - <<'PY'
          import heartbeat, task_queue, circuit_breaker
          print("modul kapisi: heartbeat + task_queue + circuit_breaker OK")
          PY
          sudo -n systemctl enable nirvana-salesbot.service 2>/dev/null || true
          sudo -n systemctl reset-failed nirvana-salesbot.service 2>/dev/null || true
          sudo -n systemctl restart nirvana-salesbot.service
          sudo -n systemctl restart devsolve-runner.service 2>/dev/null || true
          # Type=notify: READY=1 gelene kadar durum "activating" olur — bekle.
          BOT_STATE=""
          for _ in $(seq 1 30); do
            # 'set -e' + komut ikamesi: is-active "activating" iken non-zero
            # döner; '|| true' olmadan script burada sessizce ölür.
            BOT_STATE="$(systemctl is-active nirvana-salesbot.service || true)"
            if [ "${BOT_STATE}" = "active" ] || [ "${BOT_STATE}" = "failed" ]; then break; fi
            sleep 2
          done
          echo "satis botu: ${BOT_STATE} | runner: $(systemctl is-active devsolve-runner.service)"
          if [ "${BOT_STATE}" != "active" ]; then
            echo "::error::nirvana-salesbot.service aktif degil — satis botu CANLI DEGIL"
            systemctl --no-pager -l status nirvana-salesbot.service | head -30 || true
            sudo -n journalctl -u nirvana-salesbot.service -n 40 --no-pager -o cat || true
            exit 1
          fi
          sudo -n journalctl -u nirvana-salesbot.service -n 12 --no-pager -o cat || true
          echo "NIRVANA ORACLE LIVE"
          REMOTE
