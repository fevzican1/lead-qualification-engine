name: "Nirvana Stealth Form (Lane O/P/Q — Oracle'a taşındı, pasif yedek)"

# Lane O + Lane V artik Oracle VM'de (systemd: nirvana-captcha.timer + form serisi).
# Bu workflow SADECE manuel workflow_dispatch ile tetiklenir (yerel test / acil yedek);
# zamanlanmis cron KALDIRILDI — Oracle kotasi + cift calisma riski yok.
on:
  workflow_dispatch:
    inputs:
      targets:
        description: "Comma-separated form URLs (optional)"
        required: false
        default: ""

concurrency:
  group: nirvana-stealth-form
  cancel-in-progress: false

jobs:
  stealth-submit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -q httpx pyyaml
      - name: Stealth form submit (Lane O — MANUEL YEDEK, Oracle birincil)
        run: |
          echo "NOT: Birincil form serisi Oracle VM'dedir (captcha_queue + max 2 worker). Bu kosu manuel yedektir."
          if [ -n "${{ github.event.inputs.targets }}" ]; then
            python -m nirvana.runner stealth_former --urls "${{ github.event.inputs.targets }}"
          else
            python -m nirvana.runner stealth_former
          fi
      - name: Message optimizer (Lane P)
        run: python -m nirvana.runner message_optimizer
