name: discover-cc-tr

on:
  schedule:
    - cron: "10,35 * * * *"
  workflow_dispatch:

# Ayni tetik ust uste bindiginde GitHub 1 running + 1 pending tutar;
# fazlasi dusurulur -> Pending/Queued kilitlenmesi olmaz, is tamamlanir.
concurrency:
  group: discover-cc-tr
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  shard:
    uses: ./.github/workflows/harvest-shard.yml
    with:
      profile: tr
      source: commoncrawl-tr
      shard_count: 50
