name: discover-cc-tr

on:
  schedule:
    - cron: "6,36 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shard:
    if: ${{ vars.ENABLE_LEGACY_SMB_WORKFLOWS == 'true' }}
    uses: ./.github/workflows/harvest-shard.yml
    with:
      profile: tr
      source: commoncrawl-tr
      shard_count: 50
