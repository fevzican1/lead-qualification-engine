name: discover-cc-platform

on:
  schedule:
    - cron: "24,54 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shard:
    if: ${{ vars.ENABLE_LEGACY_SMB_WORKFLOWS == 'true' }}
    uses: ./.github/workflows/harvest-shard.yml
    with:
      profile: platform
      source: commoncrawl-platform
      shard_count: 50
