name: discover-cc-platform

on:
  schedule:
    - cron: "25,55 * * * *"
  workflow_dispatch:

# Ayni tetik ust uste bindiginde GitHub 1 running + 1 pending tutar;
# fazlasi dusurulur -> Pending/Queued kilitlenmesi olmaz, is tamamlanir.
concurrency:
  group: discover-cc-platform
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  shard:
    uses: ./.github/workflows/harvest-shard.yml
    with:
      profile: platform
      source: commoncrawl-platform
      shard_count: 50
