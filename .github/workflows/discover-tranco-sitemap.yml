name: discover-tranco-sitemap

on:
  schedule:
    - cron: "50 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: discover-tranco-sitemap
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -q httpx python-dotenv
      - name: Discover public sitemap contacts
        run: |
          python scripts/tranco_sitemap.py \
            --out feeds/shards/tranco-sitemap.json \
            --max-domains 400 \
            --deadline 480 \
            --delay 0.2 \
            --limit 4000
      - name: Commit shard
        run: |
          set -euo pipefail
          git config user.name "devsolve-discover"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python scripts/clean_merge_markers.py feeds/shards/tranco-sitemap.json
          for attempt in 1 2 3; do
            git add feeds/shards/tranco-sitemap.json
            if ! python scripts/clean_merge_markers.py --check feeds/shards/tranco-sitemap.json; then
              echo "Tranco shard contains conflict markers/invalid JSON — refusing to commit"
              git reset -q 2>/dev/null || true
              git checkout -q -- feeds/shards/tranco-sitemap.json 2>/dev/null || true
              sleep $((attempt * 5))
              continue
            fi
            if git diff --cached --quiet; then
              echo "No shard changes"
              exit 0
            fi
            git commit -m "feed: update Tranco sitemap shard"
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || git merge --abort 2>/dev/null || true
            git reset --soft HEAD~1 2>/dev/null || true
            sleep $((attempt * 5))
          done
          echo "Tranco shard push failed after retries"
          exit 1
