# Nirvana Web Live Chat Engine — nginx reverse proxy (Oracle Always Free, $0)
#
# Musteri trafigi:  http://<vm-public-ip>/chat  ->  127.0.0.1:8765 (FastAPI+WS)
# WebSocket upgrade zorunlu (/ws/<sid>), aksi halde sohbet tek yonlu kalir.
#
# Kurulum (deploy_webchat.sh otomatik yapar):
#   sudo cp oracle/webchat-nginx.conf /etc/nginx/sites-available/nirvana-webchat
#   sudo ln -sf /etc/nginx/sites-available/nirvana-webchat /etc/nginx/sites-enabled/nirvana-webchat
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx

upstream nirvana_webchat {
    server 127.0.0.1:8765;
    keepalive 32;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Ses notu (.mp3) + JSON gövde; 4 MB fazlasiyla yeterli (Always Free disk dostu).
    client_max_body_size 4m;
    client_body_timeout 30s;

    access_log /var/log/nginx/nirvana-webchat.access.log;
    error_log  /var/log/nginx/nirvana-webchat.error.log warn;

    # --- WebSocket: uzun omurlu sohbet kanali -------------------------------
    location /ws/ {
        proxy_pass http://nirvana_webchat;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;   # sohbet bos kalsa da kanal kapanmasin
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # --- Sesli mesaj (Edge-TTS .mp3) ---------------------------------------
    location /voice/ {
        proxy_pass http://nirvana_webchat;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        expires 10m;
        add_header Cache-Control "public, max-age=600";
    }

    # --- Saglik kontrolu (systemd/deploy dogrulamasi) ----------------------
    location = /health {
        proxy_pass http://nirvana_webchat/health;
        access_log off;
        proxy_set_header Host $host;
    }

    # --- Sohbet UI + API ---------------------------------------------------
    location / {
        proxy_pass http://nirvana_webchat;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        # $0 tls yoksa da musteriye dogru karakter seti gitsin
        charset utf-8;
    }
}
