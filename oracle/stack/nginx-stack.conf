# Rapor 2.2 — musteri-hatti servisleri icin nginx ornegi (Oracle VM).
# Kurulum: sudo cp oracle/stack/nginx-stack.conf /etc/nginx/sites-available/nv-stack
#          sudo ln -s /etc/nginx/sites-available/nv-stack /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
# Sadece 80/tcp acilir; TLS icin certbot --nginx kullanin (Always Free $0).
# Not: 80 portu webchat'e (127.0.0.1:8765) ayrilmis; bu bloklar ayni 80'de
# server_name ile ayrisir, mevcut webchat blogu bozulmaz.

server {
    listen 80;
    server_name sign.ORNEK-DOMAIN.com;

    client_max_body_size 25m;
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 80;
    server_name onboard.ORNEK-DOMAIN.com;

    client_max_body_size 25m;
    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
