# OpenTelemetry Collector configuration for white-label telemetry pipeline.
# Receives traces from instrumented services, exports to Tracetest / SigNoz / Tempo.
#
# Run: otelcol-contrib --config otel/collector.yaml

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128
  batch:
    timeout: 5s
    send_batch_size: 512

exporters:
  otlp:
    endpoint: "${OTEL_EXPORTER_OTLP_ENDPOINT:http://tempo:4317}"
    tls:
      insecure: true
  logging:
    loglevel: debug

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp, logging]
